<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE•DCX8 | CS2 Skins & Esports Cyber-Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #050608;
      --bg-secondary: #121418;
      --bg-elevated: #1a1d24;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.55);
      --text-primary: #F5F6F8;
      --text-secondary: #AAB8C8;
      --accent-gold: #D4AF37;
      --accent-gold-bright: #FFE169;
      --accent-gold-glow: rgba(212, 175, 55, 0.6);
      --cyber-cyan: #00F0FF;
      --cyber-pink: #FF003C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Animated Cyber Background Elements */
    .cyber-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      opacity: 0.2;
      animation: scanMove 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes scanMove {
      0% { top: -5%; opacity: 0; }
      50% { opacity: 0.35; }
      100% { top: 105%; opacity: 0; }
    }

    h1, h2, h3, .cyber-title {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 2;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5, 6, 8, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-gold);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--text-primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      text-shadow: 0 0 10px var(--accent-gold);
    }

    .logo-dot {
      color: var(--accent-gold);
      margin: 0 6px;
      text-shadow: 0 0 15px var(--accent-gold-bright);
    }

    .nav-links {
      display: flex;
      gap: 34px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: var(--accent-gold-bright);
      text-shadow: 0 0 12px var(--accent-gold-glow);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -6px;
      left: 50%;
      background-color: var(--accent-gold);
      transition: all 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
      left: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lang-switch {
      display: flex;
      background: var(--bg-secondary);
      border: 1px solid var(--border-gold);
      padding: 2px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn.active {
      background: var(--accent-gold);
      color: var(--bg-primary);
    }

    /* Cyber Buttons */
    .btn-cyber {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 28px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
    }

    .btn-cyber-primary {
      background: var(--accent-gold);
      color: var(--bg-primary);
      box-shadow: 0 0 20px var(--accent-gold-glow);
    }

    .btn-cyber-primary:hover {
      background: var(--accent-gold-bright);
      box-shadow: 0 0 35px var(--accent-gold-glow);
      transform: translateY(-2px);
    }

    .btn-cyber-outline {
      background: rgba(212, 175, 55, 0.05);
      color: var(--accent-gold);
      border: 1px solid var(--border-gold);
    }

    .btn-cyber-outline:hover {
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 0 25px var(--accent-gold-glow);
      color: var(--accent-gold-bright);
    }

    /* Hero */
    .hero {
      padding: 120px 0 100px;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
    }

    .club-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-gold);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 30px;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 4.6vw, 4.2rem);
      font-weight: 900;
      line-height: 1.15;
      max-width: 980px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .hero h1 .highlight {
      color: var(--accent-gold);
      text-shadow: 0 0 25px var(--accent-gold-glow);
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--text-secondary);
      max-width: 720px;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 70px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      padding-top: 40px;
      border-top: 1px solid var(--border-subtle);
    }

    .metric-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
      transition: all 0.4s ease;
    }

    .metric-item:hover {
      border-color: var(--accent-gold);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .metric-item h3 {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .metric-item h3 span { color: var(--accent-gold); }
    .metric-item p { font-size: 0.9rem; color: var(--text-secondary); margin: 0; text-transform: uppercase; letter-spacing: 0.08em; }

    /* Sections */
    section { padding: 100px 0; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 50px;
    }

    .section-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--cyber-pink);
      margin-bottom: 10px;
      display: block;
      font-weight: 800;
      text-shadow: 0 0 10px var(--cyber-pink);
    }

    .section-title { font-size: clamp(1.8rem, 3.2vw, 2.6rem); font-weight: 900; text-transform: uppercase; }

    .filter-tabs { display: flex; flex-wrap: wrap; gap: 10px; }

    .filter-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: 'Orbitron', sans-serif;
      padding: 10px 18px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.3s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent-gold);
      color: var(--bg-primary);
      background: var(--accent-gold);
      font-weight: 700;
    }

    /* Animated Horizontal Slider (Right to Left) */
    .slider-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
      mask-image: linear-gradient(90deg, transparent, black 10%, black 90%, transparent);
    }

    .slider-track-wrapper {
      display: flex;
      width: max-content; /* Crucial for animation */
      animation: scrollRightToLeft 60s linear infinite; /* 60s for slow, smooth drift */
      will-change: transform;
    }

    .slider-track-wrapper:hover {
      animation-play-state: paused; /* Stop on hover */
    }

    @keyframes scrollRightToLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } /* Duplicated content shifts 50% */
    }

    .services-grid {
      display: flex;
      gap: 30px;
      padding: 10px 0;
    }

    .service-card {
      flex: 0 0 370px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-gold);
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px));
      transition: all 0.4s ease;
    }

    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 50px var(--accent-gold-glow);
      border-color: var(--accent-gold-bright);
    }

    .service-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 55px;
      height: 4px;
      background: var(--accent-gold);
      box-shadow: 0 0 15px var(--accent-gold);
    }

    .service-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .service-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 5px 12px;
      font-weight: 700;
    }
    .service-model { font-size: 0.85rem; color: var(--accent-gold-bright); font-weight: 600; }
    .service-card h3 { font-size: 1.25rem; margin-bottom: 12px; line-height: 1.35; }
